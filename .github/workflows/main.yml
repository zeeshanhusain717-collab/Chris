name: Build Zeeshan AI Voice & Permissions APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Native C++ Voice-Enabled Android APK with Permissions
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: 4. Create Directory Structure Step-by-Step
        run: |
          set -euo pipefail
          echo "📂 Creating structured directory hierarchy..."
          mkdir -p app/src/main/java/com/zeeshan/ai
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/cpp

      - name: 5. Download AI Brain from Zeeshan's Chris Repository
        run: |
          echo "=================================================="
          echo "🌐 Downloading Zeeshan's AI Brain from Chris repo..."
          echo "=================================================="
          
          AI_BRAIN_URL="https://github.com/zeeshanhusain717-collab/Chris/raw/refs/heads/main/brain.cpp"
          curl -sL -o app/src/main/cpp/brain.cpp "$AI_BRAIN_URL"
          
          ls -lh app/src/main/cpp/brain.cpp

      - name: 6. Write gradle.properties
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.daemon=false
          EOF

      - name: 7. Write settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ZeeshanAI"
          include(":app")
          EOF

      - name: 8. Write Root build.gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF

      - name: 9. Write App-level build.gradle with NDK/CMake
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }
          android {
              namespace "com.zeeshan.ai"
              compileSdk 34
              defaultConfig {
                  applicationId "com.zeeshan.ai"
                  minSdk 26
                  targetSdk 34
                  versionCode 38
                  versionName "3.8"
                  externalNativeBuild {
                      cmake {
                          cppFlags "-std=c++17 -O2"
                      }
                  }
              }
              buildTypes { 
                  release { minifyEnabled false }
                  debug { minifyEnabled false }
              }
              externalNativeBuild {
                  cmake {
                      path file("src/main/cpp/CMakeLists.txt")
                      version "3.22.1"
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.12.0"
          }
          EOF

      - name: 10. Write Strings Resource File
        run: |
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Zeeshan AI Voice Engine</string>
          </resources>
          EOF

      - name: 11. Write Red App Icon Vector Drawable
        run: |
          cat > app/src/main/res/drawable/ic_app_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#DC2626"
                  android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M4,11h3v-3h2v3h3v2h-3v3H7v-3H4V11z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M13,8h5v2h-3v1h2c0.55,0 1,0.45 1,1v2c0,0.55 -0.45,1 -1,1h-4v-2h3v-1h-3V8z"/>
          </vector>
          EOF

      - name: 12. Write Android Manifest File with Permissions
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              
              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_app_icon"
                  android:roundIcon="@drawable/ic_app_icon"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: 13. Write CMakeLists.txt to compile brain.cpp directly
        run: |
          cat > app/src/main/cpp/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project("z2ai")
          add_library(z2ai SHARED brain.cpp)
          find_library(log-lib log)
          target_link_libraries(z2ai ${log-lib})
          EOF

      - name: 14. Write Cyberpunk MainActivity.kt with Native C++, Voice TTS & Runtime Permissions
        run: |
          cat > app/src/main/java/com/zeeshan/ai/MainActivity.kt <<'EOF'
          package com.zeeshan.ai

          import android.Manifest
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.speech.tts.TextToSpeech
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import java.util.*

          class MainActivity : AppCompatActivity(), TextToSpeech.OnInitListener {

              companion object {
                  init {
                      System.loadLibrary("z2ai")
                  }
                  private const val PERMISSION_REQUEST_CODE = 200
              }

              private external fun nativeGetAIResponse(query: String): String

              private lateinit var chatContainer: LinearLayout
              private lateinit var scrollView: ScrollView
              private lateinit var inputMessage: EditText
              private lateinit var sendBtn: Button
              private lateinit var tts: TextToSpeech
              private var isTtsReady = false
              private val handler = Handler(Looper.getMainLooper())

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  // Request Runtime Permissions on Startup (Microphone/Audio)
                  checkAndRequestPermissions()

                  tts = TextToSpeech(this, this)

                  val mainRoot = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = GradientDrawable(
                          GradientDrawable.Orientation.TOP_BOTTOM,
                          intArrayOf(Color.parseColor("#09090B"), Color.parseColor("#18181B"), Color.parseColor("#27272A"))
                      )
                      layoutParams = LinearLayout.LayoutParams(-1, -1)
                  }

                  val topBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#18181B"))
                          cornerRadius = 40f
                          setStroke(3, Color.parseColor("#EC4899"))
                      }
                      setPadding(40, 30, 40, 30)
                      elevation = 32f
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply {
                          setMargins(24, 30, 24, 15)
                      }
                  }

                  val headerInfoLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                  }

                  val titleTv = TextView(this).apply {
                      text = "⚡ Zeeshan AI [Voice + Permissions]"
                      textSize = 17f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#F43F5E"))
                  }

                  val subtitleTv = TextView(this).apply {
                      text = "🎙️ 100% Offline C++ Engine"
                      textSize = 12f
                      setTextColor(Color.parseColor("#38BDF8"))
                  }

                  headerInfoLayout.addView(titleTv)
                  headerInfoLayout.addView(subtitleTv)

                  val clearBtn = Button(this).apply {
                      text = "🗑️"
                      textSize = 14f
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#27272A"))
                          cornerRadius = 25f
                          setStroke(2, Color.parseColor("#F43F5E"))
                      }
                      setTextColor(Color.WHITE)
                      setOnClickListener {
                          try {
                              chatContainer.removeAllViews()
                              addAIMessage("मेमोरी रीसेट! जीशान भाई, नया सवाल पूछें।")
                          } catch (e: Exception) {
                              e.printStackTrace()
                          }
                      }
                      layoutParams = LinearLayout.LayoutParams(100, 100)
                  }

                  topBar.addView(headerInfoLayout)
                  topBar.addView(clearBtn)
                  mainRoot.addView(topBar)

                  scrollView = ScrollView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(-1, 0, 1f).apply {
                          setMargins(20, 10, 20, 10)
                      }
                      isFillViewport = true
                  }

                  chatContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(15, 15, 15, 15)
                  }
                  scrollView.addView(chatContainer)
                  mainRoot.addView(scrollView)

                  val inputLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#18181B"))
                          cornerRadius = 50f
                          setStroke(3, Color.parseColor("#8B5CF6"))
                      }
                      setPadding(35, 12, 12, 12)
                      elevation = 40f
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply {
                          setMargins(24, 15, 24, 35)
                      }
                  }

                  inputMessage = EditText(this).apply {
                      hint = "हिंदी में टाइप करें..."
                      setHintTextColor(Color.parseColor("#71717A"))
                      setTextColor(Color.WHITE)
                      textSize = 16f
                      setBackgroundColor(Color.TRANSPARENT)
                      layoutParams = LinearLayout.LayoutParams(0, -2, 1f).apply {
                          setMargins(10, 0, 15, 0)
                      }
                  }

                  sendBtn = Button(this).apply {
                      text = "🚀"
                      textSize = 18f
                      background = GradientDrawable(
                          GradientDrawable.Orientation.LEFT_RIGHT,
                          intArrayOf(Color.parseColor("#8B5CF6"), Color.parseColor("#EC4899"))
                      ).apply {
                          cornerRadius = 40f
                      }
                      setTextColor(Color.WHITE)
                      setTypeface(null, Typeface.BOLD)
                      setOnClickListener {
                          val text = inputMessage.text.toString().trim()
                          if (text.isNotEmpty()) {
                              addUserMessage(text)
                              inputMessage.setText("")
                              triggerNativeAIResponse(text)
                          }
                      }
                      layoutParams = LinearLayout.LayoutParams(130, 130)
                  }

                  inputLayout.addView(inputMessage)
                  inputLayout.addView(sendBtn)
                  mainRoot.addView(inputLayout)

                  setContentView(mainRoot)

                  addAIMessage("नमस्ते जीशान भाई! वॉइस, परमिशन्स और C++ AI ब्रेन पूरी तरह तैयार हैं।")
              }

              private fun checkAndRequestPermissions() {
                  val micPermission = ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO)
                  if (micPermission != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(
                          this,
                          arrayOf(Manifest.permission.RECORD_AUDIO),
                          PERMISSION_REQUEST_CODE
                      )
                  }
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      val result = tts.setLanguage(Locale("hi", "IN"))
                      if (result == TextToSpeech.LANG_MISSING_DATA || result == TextToSpeech.LANG_NOT_SUPPORTED) {
                          tts.setLanguage(Locale.US)
                      } else {
                          isTtsReady = true
                      }
                  }
              }

              private fun speakOut(text: String) {
                  if (isTtsReady && text.isNotEmpty()) {
                      tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, null)
                  }
              }

              private fun addUserMessage(message: String) {
                  try {
                      val msgView = TextView(this).apply {
                          text = "👤  $message"
                          setTextColor(Color.WHITE)
                          textSize = 15f
                          setPadding(40, 28, 40, 28)
                          background = GradientDrawable(
                              GradientDrawable.Orientation.TL_BR,
                              intArrayOf(Color.parseColor("#9333EA"), Color.parseColor("#4F46E5"))
                          ).apply {
                              cornerRadius = 35f
                          }
                          elevation = 12f
                          layoutParams = LinearLayout.LayoutParams(-2, -2).apply {
                              gravity = Gravity.END
                              setMargins(120, 15, 15, 15)
                          }
                      }
                      chatContainer.addView(msgView)
                      scrollToBottom()
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun addAIMessage(message: String, speak: Boolean = true) {
                  try {
                      val msgView = TextView(this).apply {
                          text = "🤖  $message"
                          setTextColor(Color.parseColor("#F4F4F5"))
                          textSize = 15f
                          setPadding(40, 28, 40, 28)
                          background = GradientDrawable(
                              GradientDrawable.Orientation.TL_BR,
                              intArrayOf(Color.parseColor("#27272A"), Color.parseColor("#18181B"))
                          ).apply {
                              cornerRadius = 35f
                              setStroke(2, Color.parseColor("#EC4899"))
                          }
                          elevation = 16f
                          layoutParams = LinearLayout.LayoutParams(-2, -2).apply {
                              gravity = Gravity.START
                              setMargins(15, 15, 120, 15)
                          }
                      }
                      chatContainer.addView(msgView)
                      scrollToBottom()
                      if (speak) {
                          speakOut(message)
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun triggerNativeAIResponse(userQuery: String) {
                  handler.postDelayed({
                      try {
                          val response = nativeGetAIResponse(userQuery)
                          addAIMessage(response, true)
                      } catch (e: Exception) {
                          addAIMessage("C++ इंजन प्रोसेस करते समय त्रुटि आई है भाई!", true)
                      }
                  }, 300)
              }

              private fun scrollToBottom() {
                  handler.post {
                      try {
                          scrollView.fullScroll(View.FOCUS_DOWN)
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }
              }

              override fun onDestroy() {
                  if (::tts.isInitialized) {
                      tts.stop()
                      tts.shutdown()
                  }
                  super.onDestroy()
              }
          }
          EOF

      - name: 15. Compile and Build Signed APK with C++ NDK, Voice & Permissions
        run: |
          echo "⚙️ Starting Gradle Build & NDK C++ Compilation..."
          gradle assembleDebug

      - name: 16. Upload APK Artifact for Download
        uses: actions/upload-artifact@v4
        with:
          name: Zeeshan-AI-Voice-Permissions-APK
          path: app/build/outputs/apk/debug/app-debug.apk
